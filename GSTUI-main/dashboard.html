<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1E293B">
  <title>GST Invoice Manager — Dashboard</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .party-live-enhance{display:none}body.party-active .breadcrumb{display:none}body.party-active .heading-block{display:block}body.party-active .main{padding-top:0}.party-live-enhance + *{}#parties .party-page{padding-top:8px}#parties .party-toolbar{margin-bottom:16px}#parties .party-search-box{height:44px;width:360px;border:1px solid #BFE3F7;border-radius:13px;background:linear-gradient(135deg,#fff,#eef8ff);box-shadow:0 7px 18px rgba(14,165,233,.12);transition:.25s}#parties .party-search-box:focus-within{border-color:#22A7E8;box-shadow:0 0 0 4px rgba(34,167,232,.12),0 10px 22px rgba(14,165,233,.14);transform:translateY(-1px)}#parties .party-search-box input{font-size:13px;font-weight:600}#parties .party-table-card{border:1px solid #d7eaf5;border-radius:20px;background:linear-gradient(145deg,#fff,#f5fafe);box-shadow:0 16px 35px rgba(30,64,175,.1);position:relative;overflow:hidden}#parties .party-table-card:before{content:"";display:block;height:4px;background:linear-gradient(90deg,#00abe4,#2563eb,#7c3aed,#00abe4);background-size:220% 100%;animation:partyGradient 5s linear infinite}#parties .party-table th{padding:15px 16px;background:linear-gradient(180deg,#eff9ff,#e7f4fc);color:#176487;font-size:11px;border-bottom:1px solid #cfe5f1}#parties .party-table td{padding:17px 16px;font-size:14px;color:#334155;border-bottom:1px solid #e6eef4;transition:.2s}#parties .party-table td strong{font-size:14px}#parties .party-table tbody tr{animation:partyRowIn .4s ease both}#parties .party-table tbody tr:hover{background:linear-gradient(90deg,#f0faff,#f8fbff,#f5f3ff)}#parties .party-table tbody tr:hover td{transform:translateX(2px)}#parties .party-table td:nth-child(2){color:#2563eb;font-weight:700}#parties .party-table td:nth-child(4){color:#128c7e;font-weight:700}#parties .party-action{min-width:92px;height:38px;padding:0 15px;border:0;border-radius:11px;position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:12px;font-weight:900;letter-spacing:.25px;cursor:pointer;transform:translateY(0);transition:transform .16s ease,box-shadow .16s ease,filter .16s ease;isolation:isolate;box-shadow:0 5px 0 #b8cbe0,0 9px 16px rgba(15,23,42,.14),inset 0 2px 1px rgba(255,255,255,.9),inset 0 -2px 3px rgba(15,23,42,.12)}#parties .party-action:before{width:23px;height:23px;border-radius:7px;display:grid;place-items:center;position:relative;z-index:2;font-size:13px;line-height:1;background:rgba(255,255,255,.32);box-shadow:inset 1px 1px 2px rgba(255,255,255,.8),inset -1px -1px 2px rgba(15,23,42,.12);transition:transform .2s ease,box-shadow .2s ease}#parties .party-action:after{content:"";position:absolute;z-index:1;top:-40%;left:-80%;width:55%;height:180%;transform:rotate(24deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);transition:left .55s ease;pointer-events:none}.party-action.edit{color:#fff;background:linear-gradient(180deg,#4facfe 0%,#2563eb 52%,#1d4ed8 100%);box-shadow:0 5px 0 #163b9a,0 10px 17px rgba(37,99,235,.28),inset 0 2px 1px rgba(255,255,255,.5),inset 0 -3px 4px rgba(20,52,130,.28)}#parties .party-action.edit:before{content:"✎"}.party-action.delete{color:#fff;background:linear-gradient(180deg,#fb7185 0%,#ef4444 52%,#dc2626 100%);box-shadow:0 5px 0 #991b1b,0 10px 17px rgba(220,38,38,.25),inset 0 2px 1px rgba(255,255,255,.5),inset 0 -3px 4px rgba(127,29,29,.28)}#parties .party-action.delete:before{content:"⌫"}#parties .party-action:hover{transform:translateY(-3px);filter:saturate(1.08);box-shadow:0 8px 0 #163b9a,0 15px 24px rgba(37,99,235,.3),inset 0 2px 1px rgba(255,255,255,.55),inset 0 -3px 4px rgba(20,52,130,.25)}#parties .party-action.delete:hover{box-shadow:0 8px 0 #991b1b,0 15px 24px rgba(220,38,38,.28),inset 0 2px 1px rgba(255,255,255,.55),inset 0 -3px 4px rgba(127,29,29,.25)}#parties .party-action:hover:after{left:125%}#parties .party-action:hover:before{transform:translateY(-1px) scale(1.08) rotate(-4deg);box-shadow:inset 1px 1px 2px rgba(255,255,255,.9),0 3px 7px rgba(15,23,42,.15)}#parties .party-action.delete:hover:before{transform:translateY(-1px) scale(1.08) rotate(7deg)}#parties .party-action:active{transform:translateY(3px);box-shadow:0 2px 0 #163b9a,0 5px 9px rgba(37,99,235,.2),inset 0 2px 4px rgba(15,23,42,.22)}#parties .party-action.delete:active{box-shadow:0 2px 0 #991b1b,0 5px 9px rgba(220,38,38,.18),inset 0 2px 4px rgba(15,23,42,.22)}@keyframes partyGradient{from{background-position:0 0}to{background-position:220% 0}}@keyframes partyRowIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
    #parties .party-table{table-layout:auto;width:100%}#parties .party-table th:nth-child(1),#parties .party-table td:nth-child(1){width:28%;min-width:190px}#parties .party-table th:nth-child(2),#parties .party-table td:nth-child(2){width:16%;white-space:nowrap}#parties .party-table th:nth-child(3),#parties .party-table td:nth-child(3){width:27%;min-width:200px}#parties .party-table th:nth-child(4),#parties .party-table td:nth-child(4){width:17%;white-space:nowrap}#parties .party-table th:nth-child(5),#parties .party-table td:nth-child(5),#parties .party-table th:nth-child(6),#parties .party-table td:nth-child(6){width:6%;white-space:nowrap;text-align:center}#parties .party-table td:nth-child(2),#parties .party-table td:nth-child(4){font-size:13px}#parties .party-table td:nth-child(3){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    body.settings-active .breadcrumb{display:none}body.settings-active .heading-block{display:block}body.settings-active .main{padding-top:0}#settings .settings-page{padding-top:8px}#settings .settings-page>p,#settings .settings-page>.settings-intro,#settings .settings-page .settings-description{display:none!important}
    .profile-menu-wrap{position:relative}.profile-trigger{border:0;cursor:pointer}.profile-menu{position:absolute;right:0;top:52px;width:260px;padding:10px;background:#fff;border:1px solid #E2E8F0;border-radius:18px;box-shadow:12px 16px 30px rgba(15,23,42,.16),inset 1px 1px 2px rgba(255,255,255,.95);opacity:0;visibility:hidden;transform:translateY(-7px) scale(.98);transform-origin:top right;transition:.18s;z-index:200}.profile-menu-wrap.open .profile-menu{opacity:1;visibility:visible;transform:translateY(0) scale(1)}.profile-menu-head{display:flex;align-items:center;gap:10px;padding:8px 8px 11px}.profile-avatar-large{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(145deg,#3B82F6,#1E3A8A);color:#fff;font-size:10px;font-weight:900;box-shadow:5px 6px 11px rgba(37,99,235,.2),inset 1px 1px 2px rgba(255,255,255,.3)}.profile-menu-head strong,.profile-menu-head small{display:block}.profile-menu-head strong{font-size:10px;color:#0F172A}.profile-menu-head small{font-size:8px;color:#64748B;margin-top:3px}.profile-divider{height:1px;background:#E2E8F0;margin:2px 0 7px}.profile-menu>button{width:100%;border:0;background:transparent;color:#334155;border-radius:11px;padding:10px 9px;display:flex;align-items:center;gap:10px;text-align:left;font-size:10px;cursor:pointer}.profile-menu>button span{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:#F1F5F9;color:#2563EB;font-size:12px}.profile-menu>button:hover{background:#EFF6FF;color:#1E3A8A}.profile-menu>button:last-child:hover{background:#FEF2F2;color:#EF4444}
    .nav-group{position:relative}.submenu{display:none;padding:4px 0 6px 44px}.submenu.open{display:block}.submenu a{display:flex;align-items:center;justify-content:space-between;gap:8px;text-decoration:none;color:#64748B;padding:8px 12px;border-radius:9px;font-size:10px}.submenu a:hover,.submenu a.active{background:#EFF6FF;color:#2563EB}.submenu a small{font-size:7px;opacity:.7}.nav-parent{width:100%;border:0;background:transparent;color:inherit;font:inherit;cursor:pointer;text-align:left;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px}.nav-parent em{margin-left:auto;font-style:normal;font-size:8px;opacity:.55}.nav-parent b{font-size:11px;opacity:.6}
  </style>
</head>
<body>
  <div class="ambient ambient-one"></div><div class="ambient ambient-two"></div>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-top"><div class="brand-3d"><div class="brand-logo">₹</div><div class="brand-copy"><strong>GST INVOICE</strong><span>MANAGER</span></div></div></div>
      <nav class="sidebar-nav">
        <a class="active" href="#dashboard"><span class="nav-icon">⌂</span><span>Dashboard</span><em>01</em></a>
        <a href="#upload"><span class="nav-icon">↥</span><span>Upload Invoice</span><em>02</em></a>
        <div class="nav-group">
          <button class="nav-parent" type="button" onclick="toggleSubmenu('reportSubmenu')"><span class="nav-icon">▤</span><span>Report</span><em>03</em><b>⌄</b></button>
          <div id="reportSubmenu" class="submenu">
            <a href="#pending-invoice"><span>Pending Invoice</span></a>
            <a href="#upload-invoice-report"><span>Upload Invoice</span></a>
            <a href="#ai-report"><span>AI Report</span></a>
          </div>
        </div>
        <a href="#parties"><span class="nav-icon">♙</span><span>Party List</span><em>04</em></a>
        <a href="#settings"><span class="nav-icon">⚙</span><span>Settings</span><em>05</em></a>
      </nav>
    </aside>
    <main class="main">
      <header class="topbar"><div class="heading-block"><div class="breadcrumb"><span>GST MANAGER</span><b>/</b><span id="crumbTitle">Dashboard</span></div><h1 id="pageTitle">Dashboard</h1></div><div class="top-actions"><button class="icon-btn" aria-label="Search">⌕</button><button class="notify-btn" aria-label="Notifications">◌<i></i></button><div class="profile-menu-wrap"><button class="avatar profile-trigger" type="button" aria-label="Profile menu">ER</button><div class="profile-menu"><div class="profile-menu-head"><div class="profile-avatar-large">ER</div><div><strong>Easy Recharge Solution</strong><small>GST Workspace</small></div></div><div class="profile-divider"></div><button type="button" onclick="showSection('settings'); closeProfileMenu()"><span>👤</span> Profile</button><button type="button" onclick="logout()"><span>↪</span> Logout</button></div></div></div></header>
      <div id="dashboard" class="page-section page-module-host" data-page-module="dashboard"></div>
      <div id="upload" class="page-section page-module-host" data-page-module="upload"></div>
      <div id="parties" class="page-section page-module-host" data-page-module="parties"></div>
      <div id="reports" class="page-section page-module-host" data-page-module="reports"></div>
      <div id="settings" class="page-section page-module-host" data-page-module="settings"></div>
    </main>
  </div>
  <div id="reportDeleteModal" aria-hidden="true"><div class="delete-dialog"><div class="delete-icon">⌫</div><h3>Delete Invoice?</h3><p id="deleteInvoiceText">Enter the Security PIN to delete this invoice.</p><label for="deleteInvoicePin">Security PIN</label><input id="deleteInvoicePin" type="password" inputmode="numeric" maxlength="8" placeholder="Enter PIN"><div id="deletePinError" class="delete-error"></div><div class="delete-actions"><button id="deleteCancelBtn" class="delete-cancel" type="button">Cancel</button><button id="deleteConfirmBtn" class="delete-confirm" type="button">Delete Invoice</button></div></div></div>
  <script src="app.js"></script>
  <script>
    function closeProfileMenu(){document.querySelector('.profile-menu-wrap')?.classList.remove('open')}
    document.addEventListener('gstui:modules-ready',()=>{const wrap=document.querySelector('.profile-menu-wrap');const trigger=document.querySelector('.profile-trigger');if(trigger&&wrap){trigger.addEventListener('click',e=>{e.stopPropagation();wrap.classList.toggle('open')});document.addEventListener('click',()=>wrap.classList.remove('open'));wrap.querySelector('.profile-menu')?.addEventListener('click',e=>e.stopPropagation())}})
  </script>
  <script src="pages/module-loader.js?v=20260918-13"></script>
</body>
</html>
